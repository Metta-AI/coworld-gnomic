[project]
name = "gnomic"
version = "0.1.0"
description = "Gnomic coworld: the Gnome Moot of Heartleaf, a self-amending-rules game where gnome LLM players rewrite Gnome Law and an Elder LLM executes it"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "websockets>=12.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gnomic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
