<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>GNOMIC MOOT · Replay</title>
  <style>
    :root {
      /* Heartleaf night: the PICO-8 village palette after curfew. */
      --night: #f0e3c3;
      --night-soft: #f6ecd4;
      --glass: rgba(253,248,236, .9);
      --glass-solid: #fdf8ec;
      --glass-raised: #f3e8cd;
      --line: rgba(58,44,28, .14);
      --line-strong: rgba(58,44,28, .26);
      --ink: #3a2c1c;
      --ink-soft: #5a462e;
      --muted: #8a7357;
      --brass: #b97f2b;
      --brass-soft: rgba(185,127,43, .13);
      --aye: #3f8f3f;
      --aye-soft: rgba(63,143,63, .13);
      --nay: #c74b52;
      --nay-soft: rgba(199,75,82, .13);
      --seat-0: #d98a24;
      --seat-1: #3d8fd4;
      --seat-2: #4aa64e;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: "Iowan Old Style", "Palatino Linotype", Baskerville, Georgia, serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    html { background: var(--night); }
    body {
      color: var(--ink);
      background:
        radial-gradient(circle at 50% -18%, rgba(228,178,74,.18), transparent 36rem),
        linear-gradient(115deg, rgba(134,158,64, .08), transparent 40%),
        var(--night);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .24;
      background-image: repeating-linear-gradient(0deg, rgba(58,44,28,.035) 0 1px, transparent 1px 4px);
      background-size: 100% 4px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, summary:focus-visible {
      outline: 2px solid var(--brass);
      outline-offset: 3px;
    }
    [hidden] { display: none !important; }

    #app {
      position: relative;
      z-index: 1;
      height: 100dvh;
      min-height: 560px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      overflow: hidden;
    }

    .topbar {
      min-height: 70px;
      padding: 13px clamp(16px, 3vw, 38px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(250,243,228, .82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .seal {
      width: 41px;
      height: 41px;
      flex: 0 0 auto;
      border: 1px solid rgba(185,127,43, .58);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--brass);
      background: rgba(185,127,43,.06);
      box-shadow: inset 0 0 0 4px var(--night), inset 0 0 0 5px rgba(185,127,43,.2);
      font: 600 22px/1 var(--serif);
    }
    h1 { margin: 0; font: 500 clamp(21px, 2vw, 27px)/1 var(--serif); letter-spacing: .045em; }
    .session-meta { display: flex; align-items: center; justify-content: flex-end; gap: 12px; min-width: 0; }
    .mode-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--ink-soft);
      font: 700 10px/1 var(--sans);
      letter-spacing: .12em;
    }
    .mode-pill::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--aye);
      box-shadow: 0 0 9px var(--aye);
    }
    .mode-pill.connecting::before { background: var(--brass); box-shadow: 0 0 9px var(--brass); }
    .mode-pill.error::before { background: var(--nay); box-shadow: 0 0 9px var(--nay); }
    .session-copy { text-align: right; min-width: 0; }
    #turnMeta { color: var(--ink-soft); font-size: 13px; font-weight: 650; }
    #phaseMeta {
      margin-top: 3px;
      max-width: 300px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #scoreboard {
      width: min(1180px, calc(100% - 32px));
      margin: 12px auto 10px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
    }
    .delegate {
      --accent: var(--seat-0);
      position: relative;
      min-width: 0;
      padding: 10px 12px 9px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(250,243,228, .72);
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      transition: border-color .2s ease, transform .2s ease, background .2s ease;
    }
    .delegate.seat-1 { --accent: var(--seat-1); }
    .delegate.seat-2 { --accent: var(--seat-2); }
    .delegate::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 2px;
      background: var(--accent);
      opacity: .35;
    }
    .delegate.proposer {
      border-color: color-mix(in srgb, var(--accent) 58%, transparent);
      background: color-mix(in srgb, var(--accent) 8%, var(--glass));
      transform: translateY(-2px);
    }
    .delegate.proposer::after, .delegate.winner::after { height: 3px; opacity: 1; }
    .delegate.winner { border-color: rgba(185,127,43, .48); }
    .delegate.speaking {
      border-color: color-mix(in srgb, var(--accent) 72%, transparent);
      background: color-mix(in srgb, var(--accent) 13%, var(--glass));
      transform: translateY(-2px);
    }
    .delegate.speaking::after { height: 3px; opacity: 1; }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--accent);
      border: 2px solid color-mix(in srgb, var(--accent) 60%, transparent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      font: 700 11px/1 var(--mono);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: top; image-rendering: pixelated; }
    .delegate-copy { min-width: 0; }
    .delegate-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 700; }
    .delegate-owner { color: var(--muted); font-weight: 400; font-size: 11px; }
    .delegate-role { margin-top: 3px; color: var(--muted); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
    .score { min-width: 34px; text-align: right; color: var(--accent); font: 500 25px/1 var(--serif); }
    .score small { display: block; margin-top: 3px; color: var(--muted); font: 8px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; }
    .meter { grid-column: 2 / -1; height: 2px; border-radius: 99px; overflow: hidden; background: rgba(58,44,28,.07); }
    .meter span { display: block; width: 0; height: 100%; background: var(--accent); transition: width .35s ease; }

    .workspace { min-height: 0; padding: 0 16px 12px; }
    .frame {
      width: min(1180px, 100%);
      height: 100%;
      min-height: 0;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--glass);
      box-shadow: 0 24px 70px rgba(58,44,28,.22);
      overflow: hidden;
      backdrop-filter: blur(17px);
      -webkit-backdrop-filter: blur(17px);
    }
    .viewbar {
      min-height: 48px;
      padding: 7px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(58,44,28, .05);
    }
    .tabs { display: flex; align-items: center; gap: 3px; }
    .tab {
      border: 0;
      border-radius: 2px;
      padding: 7px 11px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }
    .tab:hover { color: var(--ink); }
    .tab[aria-selected="true"] { color: var(--ink); background: rgba(58,44,28,.075); }
    .count { color: var(--muted); font-weight: 500; }
    .phase-track { display: flex; align-items: center; gap: 4px; }
    .phase-step {
      min-width: 67px;
      border: 0;
      border-radius: 2px;
      padding: 6px 8px;
      color: #9b8768;
      background: transparent;
      cursor: default;
      font-size: 9px;
      font-weight: 750;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .phase-step.available { color: var(--muted); cursor: pointer; }
    .phase-step.complete { color: var(--ink-soft); }
    .phase-step.active { color: var(--brass); background: var(--brass-soft); }

    .panel { min-height: 0; overflow: auto; scrollbar-color: #d8c49a transparent; }
    #chamberPanel { position: relative; }
    #chamberPanel::before {
      content: "";
      position: fixed;
      left: 50%;
      top: 32%;
      width: min(50vw, 650px);
      height: min(50vw, 650px);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      opacity: .3;
      background: radial-gradient(circle, rgba(185,127,43,.055), transparent 68%);
    }
    #stageContent { position: relative; width: min(880px, 100%); min-height: 100%; margin: 0 auto; padding: clamp(22px, 4vh, 42px) clamp(18px, 4vw, 48px) 42px; }
    .beat-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .beat-title { max-width: 720px; margin: 0; font: 500 clamp(25px, 3.1vw, 38px)/1.08 var(--serif); text-wrap: balance; }
    .beat-subtitle { max-width: 680px; margin: 9px 0 0; color: var(--muted); font: 15px/1.5 var(--serif); }
    .turn-mark { color: var(--muted); font: 10px/1 var(--mono); white-space: nowrap; }

    .measure {
      position: relative;
      padding: clamp(19px, 3vw, 29px);
      border: 1px solid rgba(185,127,43, .24);
      border-radius: 2px;
      background: linear-gradient(145deg, rgba(185,127,43,.07), rgba(58,44,28,.012));
    }
    .measure::before {
      content: "“";
      position: absolute;
      right: 20px;
      top: -7px;
      color: rgba(185,127,43,.12);
      font: 86px/1 var(--serif);
      pointer-events: none;
    }
    .measure-text { position: relative; margin-top: 0; color: var(--ink); font: clamp(17px, 2vw, 21px)/1.52 var(--serif); }
    .measure-byline { margin-top: 14px; color: var(--muted); font-size: 11px; }
    .measure-strip {
      margin-bottom: 18px;
      padding: 11px 13px;
      border-left: 2px solid rgba(185,127,43,.55);
      background: rgba(58,44,28,.025);
      color: var(--ink-soft);
      font: 13px/1.45 var(--serif);
    }
    .measure-strip strong { color: var(--ink-soft); font: 600 13px/1.3 var(--serif); }

    details { border-top: 1px solid var(--line); }
    details > summary { padding: 12px 0; color: var(--muted); cursor: pointer; list-style: none; font-size: 11px; font-weight: 650; }
    details > summary::-webkit-details-marker { display: none; }
    details > summary::after { content: "+"; float: right; color: var(--brass); font: 16px/10px var(--mono); }
    details[open] > summary::after { content: "−"; }
    .detail-copy { padding: 0 0 15px; color: var(--ink-soft); font: 14px/1.62 var(--serif); }

    .arguments, .ballots { display: grid; gap: 10px; }
    .arguments { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .argument, .ballot {
      border: 1px solid var(--line);
      border-radius: 3px;
      background: rgba(58,44,28,.025);
      overflow: hidden;
    }
    .argument { border-top-color: color-mix(in srgb, var(--speaker) 50%, transparent); }
    .argument.speaking, .ballot.speaking { border-color: color-mix(in srgb, var(--speaker) 65%, transparent); }
    .argument > summary, .ballot > summary { padding: 14px; }
    .argument > summary::after, .ballot > summary::after { margin-top: 2px; }
    .speaker-line { display: flex; align-items: center; gap: 8px; padding-right: 18px; }
    .speaker-dot { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: var(--speaker); }
    .speaker-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font-size: 12px; }
    .stance { margin-left: auto; border-radius: 99px; padding: 4px 6px; font: 750 8px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; }
    .stance.aye { color: var(--aye); background: var(--aye-soft); }
    .stance.nay { color: var(--nay); background: var(--nay-soft); }
    .stance.undecided { color: var(--muted); background: rgba(58,44,28,.06); }
    .preview { margin: 10px 21px 0 15px; color: var(--muted); font: 13px/1.42 var(--serif); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    details[open] .preview { display: none; }
    .argument-body, .ballot-body { padding: 0 14px 15px; color: var(--ink-soft); font: 14px/1.58 var(--serif); }
    .ballots { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .ballot-mark { color: var(--muted); font: 500 23px/1 var(--serif); }
    .ballot.aye .ballot-mark { color: var(--aye); }
    .ballot.nay .ballot-mark { color: var(--nay); }
    .ballot-result { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-right: 18px; }
    .ballot-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-soft); font-size: 10px; }

    .outcome {
      padding: clamp(19px, 3vw, 28px);
      border: 1px solid var(--line);
      border-radius: 2px;
      background: rgba(58,44,28,.025);
    }
    .outcome.adopted { border-color: rgba(63,143,63,.3); background: linear-gradient(145deg, var(--aye-soft), rgba(58,44,28,.012)); }
    .outcome.rejected { border-color: rgba(199,75,82,.27); background: linear-gradient(145deg, var(--nay-soft), rgba(58,44,28,.012)); }
    .verdict { display: flex; align-items: center; gap: 9px; color: var(--ink); font: 600 15px/1 var(--serif); }
    .verdict::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .adopted .verdict::before { background: var(--aye); box-shadow: 0 0 12px rgba(63,143,63,.45); }
    .rejected .verdict::before { background: var(--nay); box-shadow: 0 0 12px rgba(199,75,82,.42); }
    .judge-summary { margin: 15px 0 0; color: var(--ink); font: clamp(16px, 1.8vw, 20px)/1.52 var(--serif); }
    .judge-byline { margin-top: 12px; color: var(--muted); font: 10px/1 var(--mono); }
    .measure.speaking, .outcome.speaking { border-color: rgba(185,127,43,.58); }
    .welcome.speaking .hero-art, .finale.speaking .hero-art { border-color: rgba(185,127,43,.72); }
    .changes { margin-top: 17px; display: flex; flex-wrap: wrap; gap: 7px; }
    .change { border: 1px solid var(--line); border-radius: 999px; padding: 6px 9px; color: var(--ink-soft); background: rgba(58,44,28,.1); font-size: 10px; }
    .technical { margin: 0; padding: 0 0 15px; color: #74603f; font: 10px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }

    .welcome, .finale, .empty-state { text-align: center; padding: clamp(26px, 6vh, 70px) 10px; }
    .hero-art {
      display: block;
      width: min(720px, 100%);
      margin: 0 auto 26px;
      border-radius: 16px;
      border: 1px solid var(--line-strong);
      box-shadow: 0 12px 34px rgba(58,44,28,.2);
    }
    .orb {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      border: 1px solid rgba(185,127,43,.42);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--brass);
      background: rgba(185,127,43,.055);
      box-shadow: inset 0 0 0 7px var(--night-soft), inset 0 0 0 8px rgba(185,127,43,.14);
      font: 500 35px/1 var(--serif);
    }
    .welcome h2, .finale h2, .empty-state h2 { margin: 0; font: 500 clamp(26px, 4vw, 43px)/1.1 var(--serif); text-wrap: balance; }
    .welcome p, .finale p, .empty-state p { max-width: 610px; margin: 13px auto 0; color: var(--muted); font: 15px/1.55 var(--serif); }
    .flow { max-width: 590px; margin: 28px auto 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
    .flow span { padding: 9px 5px; border: 1px solid var(--line); border-radius: 2px; color: var(--ink-soft); font-size: 10px; }
    .winner-list { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 25px; }
    .winner-chip { border: 1px solid rgba(185,127,43,.34); border-radius: 2px; padding: 8px 12px; background: var(--brass-soft); color: var(--ink); font-size: 11px; }
    .primary-action {
      margin-top: 25px;
      border: 1px solid rgba(185,127,43,.48);
      border-radius: 2px;
      padding: 9px 13px;
      background: var(--brass-soft);
      color: var(--brass);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }
    .primary-action:hover { background: rgba(185,127,43,.2); }

    #lawPanel { padding: clamp(20px, 4vh, 38px) clamp(18px, 4vw, 50px) 42px; }
    .law-head { width: min(880px, 100%); margin: 0 auto 22px; display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; }
    .law-head h2 { margin: 0; font: 500 clamp(25px, 3vw, 36px)/1.1 var(--serif); }
    .law-head p { margin: 5px 0 0; color: var(--muted); font: 13px/1.4 var(--serif); }
    #rules { width: min(880px, 100%); margin: 0 auto; display: grid; gap: 8px; }
    .rule {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      gap: 13px;
      padding: 15px 17px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: rgba(58,44,28,.022);
    }
    .rule.repealed { opacity: .48; }
    .rule.protected { border-left-color: rgba(185,127,43,.55); }
    .rule-no { color: var(--brass); font: 700 11px/1.35 var(--mono); }
    .rule-version { display: block; margin-top: 5px; color: var(--muted); font: 8px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; }
    .rule-copy { color: var(--ink-soft); font: 15px/1.48 var(--serif); }
    .rule.repealed .rule-copy { text-decoration: line-through; }
    .rule-history { grid-column: 2; }
    .rule-history ol { margin: 0 0 14px; padding-left: 18px; color: var(--muted); font: 12px/1.5 var(--serif); }
    .host-law { width: min(880px, 100%); margin: 18px auto 0; }
    .host-law .detail-copy { color: var(--muted); font: 12px/1.6 var(--sans); }

    .transport {
      min-height: 62px;
      padding: 10px clamp(16px, 3vw, 38px);
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: auto minmax(120px, 1fr) auto;
      align-items: center;
      gap: 14px;
      background: rgba(250,243,228, .9);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .transport-buttons { display: flex; align-items: center; gap: 5px; }
    .transport button {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: 3px;
      display: grid;
      place-items: center;
      background: rgba(58,44,28,.035);
      color: var(--ink-soft);
      cursor: pointer;
    }
    .transport button:hover:not(:disabled) { color: var(--brass); border-color: rgba(185,127,43,.52); }
    .transport button:disabled { opacity: .32; cursor: default; }
    #play { width: 39px; color: var(--brass); }
    #narration svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    #narration[aria-pressed="true"] { color: var(--brass); border-color: rgba(185,127,43,.58); background: var(--brass-soft); }
    #scrub { position: relative; min-width: 0; height: 26px; cursor: pointer; touch-action: none; }
    #scrub.empty { cursor: default; opacity: .4; }
    .scrub-track { position: absolute; left: 0; right: 0; top: 11px; height: 4px; background: rgba(58,44,28, .16); }
    .scrub-fill { position: absolute; left: 0; top: 11px; height: 4px; width: 0; background: var(--ink-soft); }
    .scrub-head { position: absolute; left: 0; top: 3px; width: 3px; height: 20px; background: var(--brass); transform: translateX(-1.5px); z-index: 3; box-shadow: 0 0 7px rgba(185,127,43, .55); }
    .turn-span { position: absolute; top: 9px; height: 8px; background: rgba(58,44,28, .05); z-index: 1; }
    .turn-span.alt { background: rgba(185,127,43, .09); }
    .turn-sep { position: absolute; top: 2px; width: 2px; height: 22px; background: rgba(58,44,28, .35); transform: translateX(-1px); z-index: 2; }
    .beat-marker { position: absolute; top: 6px; width: 2px; height: 8px; transform: translateX(-1px); background: var(--tc, var(--muted)); z-index: 2; }
    .beat-marker.seat-mark-0 { --tc: var(--seat-0); }
    .beat-marker.seat-mark-1 { --tc: var(--seat-1); }
    .beat-marker.seat-mark-2 { --tc: var(--seat-2); }
    .beat-marker.aye { --tc: var(--aye); }
    .beat-marker.nay { --tc: var(--nay); }
    .beat-marker.adopted { --tc: var(--brass); top: 2px; height: 14px; width: 3px; box-shadow: 0 0 6px var(--tc); }
    .beat-marker.final { --tc: var(--brass); top: 0; height: 9px; width: 8px; transform: translateX(-4px); box-shadow: 0 0 6px var(--tc); }
    .event-readout { min-width: 150px; text-align: right; }
    #eventLabel { color: var(--ink-soft); font-size: 10px; font-weight: 650; }
    #eventNo { margin-top: 3px; color: var(--muted); font: 9px/1 var(--mono); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    @media (max-width: 760px) {
      #app { min-height: 620px; }
      .topbar { min-height: 62px; padding: 10px 14px; }
      .seal { width: 35px; height: 35px; font-size: 18px; }
      h1 { font-size: 20px; }
      .session-meta { gap: 7px; }
      .session-copy { display: none; }
      #scoreboard { width: calc(100% - 20px); margin: 8px auto; gap: 5px; }
      .delegate { padding: 8px; grid-template-columns: minmax(0, 1fr) auto; gap: 5px; }
      .avatar { display: none; }
      .delegate-name { font-size: 10px; }
      .delegate-role { font-size: 7px; }
      .score { font-size: 21px; }
      .score small { display: none; }
      .meter { grid-column: 1 / -1; }
      .workspace { padding: 0 7px 7px; }
      .frame { border-radius: 3px; }
      .viewbar { min-height: 43px; padding: 5px 7px; overflow-x: auto; }
      .phase-track { gap: 0; }
      .phase-step { min-width: auto; padding: 6px 7px; font-size: 7px; }
      #stageContent { padding: 22px 14px 34px; }
      .beat-head { margin-bottom: 15px; }
      .turn-mark { display: none; }
      .beat-title { font-size: 28px; }
      .measure { padding: 18px; }
      .measure-text { font-size: 17px; }
      .arguments, .ballots { grid-template-columns: 1fr; }
      #lawPanel { padding: 20px 12px 34px; }
      .rule { grid-template-columns: 49px minmax(0,1fr); padding: 13px 12px; gap: 8px; }
      .rule-copy { font-size: 14px; }
      .transport { min-height: 57px; padding: 8px 10px; grid-template-columns: auto minmax(70px,1fr) auto; gap: 8px; }
      .beat-marker, .turn-sep { display: none; }
      .transport button { width: 31px; height: 31px; }
      #play { width: 35px; }
      .event-readout { min-width: 70px; }
      #eventLabel { display: none; }
    }

    @media (max-width: 430px) {
      .mode-pill { padding: 6px 8px; font-size: 8px; }
      .tab { padding: 7px 8px; font-size: 9px; }
      .phase-step { font-size: 0; width: 23px; height: 23px; padding: 0; border-radius: 50%; }
      .phase-step::before { content: ""; display: block; width: 5px; height: 5px; margin: auto; border-radius: 50%; background: currentColor; }
      .beat-subtitle { font-size: 14px; }
      .transport-buttons { gap: 3px; }
      #eventNo { font-size: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="seal" aria-hidden="true">❧</div>
        <h1>The Gnome Moot</h1>
      </div>
      <div class="session-meta">
        <div class="session-copy"><div id="turnMeta">Waiting for the Moot</div><div id="phaseMeta">Connecting to the record</div></div>
        <div id="mode" class="mode-pill connecting">CONNECTING</div>
      </div>
    </header>

    <section id="scoreboard" aria-label="Gnome scores"></section>

    <main class="workspace">
      <div class="frame">
        <div class="viewbar">
          <nav class="tabs" aria-label="Replay views">
            <button class="tab" id="chamberTab" type="button" role="tab" aria-selected="true" aria-controls="chamberPanel">Moot</button>
            <button class="tab" id="lawTab" type="button" role="tab" aria-selected="false" aria-controls="lawPanel">Gnome Law <span class="count" id="ruleCount">0</span></button>
          </nav>
          <nav class="phase-track" id="phaseTrack" aria-label="Turn phases"></nav>
        </div>
        <section class="panel" id="chamberPanel" role="tabpanel" aria-labelledby="chamberTab"><div id="stageContent"></div></section>
        <section class="panel" id="lawPanel" role="tabpanel" aria-labelledby="lawTab" hidden="">
          <div class="law-head"><div><h2>Gnome Law</h2><p>Law as it stood at this moment in the game.</p></div></div>
          <div id="rules"></div>
          <details class="host-law"><summary>Immutable host law</summary><div class="detail-copy" id="hostLaw">Three gnomes. Proposal, parallel debate, secret ballot, and the Elder&#39;s ruling. Declarative state only. Hard turn cap.</div></details>
        </section>
      </div>
    </main>

    <footer class="transport" aria-label="Replay controls">
      <div class="transport-buttons">
        <button id="back" type="button" aria-label="Previous event" title="Previous event (left arrow)">‹</button>
        <button id="play" type="button" aria-label="Play replay" title="Play or pause (space)">▶</button>
        <button id="forward" type="button" aria-label="Next event" title="Next event (right arrow)">›</button>
        <button id="narration" type="button" aria-label="Enable voice narration" aria-pressed="false" title="Voice narration off">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h3l4 3V7l-4 3H5Z"></path><path d="M15 9.5a4 4 0 0 1 0 5"></path><path d="M17.5 7a7.5 7.5 0 0 1 0 10"></path></svg>
        </button>
      </div>
      <div id="scrub" role="slider" tabindex="0" aria-label="Replay timeline" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"></div>
      <div class="event-readout"><div id="eventLabel">Awaiting record</div><div id="eventNo">0 / 0</div></div>
    </footer>
    <div class="sr-only" id="announcer" aria-live="polite"></div>
  </div>

<script>
(() => {
  "use strict";
  const $ = selector => document.querySelector(selector);
  const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
  const roman = ["I", "II", "III"];
  const phaseTypes = [
    ["action_made", "Action"],
    ["proposal_made", "Proposal"],
    ["debate_made", "Debate"],
    ["vote_reveal", "Ballot"],
    ["judge_ruling", "Ruling"]
  ];

  let events = [];
  let index = -1;
  let players = [0, 1, 2].map(seat => ({seat, policy: `Seat ${seat + 1}`}));
  let timer = null;
  let playing = false;
  let replay = false;
  let connection = "connecting";
  let activeView = "chamber";
  let narrationEnabled = false;
  let speechGeneration = 0;
  let activeSpeechFinish = null;
  let spokenDetail = null;
  let spokenDetailWasOpen = false;
  let voices = [];
  const speechSupported = Boolean(window.speechSynthesis && window.SpeechSynthesisUtterance);

  const defaultState = () => ({
    turn: 0,
    maxTurns: 45,
    phase: "lobby",
    proposer: null,
    rules: [],
    world: {players: [{points: 0}, {points: 0}, {points: 0}], common: {}},
    action: null,
    actionRuling: null,
    proposal: null,
    debates: [],
    votes: [],
    ruling: null,
    winners: [],
    required: 2,
    passed: null,
    over: false,
    reason: "",
    hostConstraints: []
  });

  function reduce(limit) {
    const state = defaultState();
    for (let i = 0; i <= limit && i < events.length; i += 1) {
      const event = events[i] || {};
      if (event.type === "game_start") {
        players = event.session?.seats || players;
        state.rules = event.rules || state.rules;
        state.world = event.state || state.world;
        state.maxTurns = event.session?.limits?.turns_max || state.maxTurns;
        state.hostConstraints = event.host_constraints || [];
        state.phase = "called to order";
      }
      if (event.type === "turn_start") {
        state.turn = event.turn;
        state.proposer = event.proposer;
        state.rules = event.rules || state.rules;
        state.world = event.state || state.world;
        state.required = event.votes_required ?? state.world?.common?.votes_required ?? state.required;
        state.action = null;
        state.actionRuling = null;
        state.proposal = null;
        state.debates = [];
        state.votes = [];
        state.ruling = null;
        state.passed = null;
        state.phase = "action";
      }
      if (event.type === "action_made") {
        state.action = event;
        state.actionRuling = null;
        state.phase = event.attempt === 2 ? "action repaired" : "action stated";
      }
      if (event.type === "action_ruling") {
        state.actionRuling = event;
        state.world = event.state || state.world;
        state.winners = event.winner_slots || [];
        state.phase = event.valid ? "action executed" : "action rejected";
      }
      if (event.type === "proposal_made") {
        state.proposal = event;
        state.phase = "proposal entered";
      }
      if (event.type === "debate_made") {
        state.debates = event.statements || [];
        state.phase = "debate";
      }
      if (event.type === "vote_reveal") {
        state.votes = event.votes || [];
        state.required = event.votes_required ?? state.required;
        state.passed = event.passed;
        state.phase = "ballot revealed";
      }
      if (event.type === "judge_ruling") {
        state.ruling = event;
        state.rules = event.rules || state.rules;
        state.world = event.state || state.world;
        state.winners = event.winner_slots || [];
        state.phase = "ruling entered";
      }
      if (event.type === "game_over") {
        state.winners = event.winner_slots || [];
        state.over = true;
        state.reason = event.reason || "The game is complete.";
        state.phase = "game over";
        if (event.game_points) state.world.players = event.game_points.map(points => ({points}));
      }
      if (event.type === "fatal_error") {
        state.phase = "error";
        state.reason = event.error || "The game ended unexpectedly.";
      }
    }
    return state;
  }

  function playerFor(seat) {
    return players.find(player => Number(player.seat) === Number(seat)) || players[seat] || {seat, policy: `Seat ${Number(seat) + 1}`};
  }
  function playerName(seat) { return playerFor(seat).policy || `Seat ${Number(seat) + 1}`; }
  const GNOME_FACES = ["ivan", "anton", "yura"];
  function gnomeFace(name) {
    const lower = String(name || "").toLowerCase();
    const gnome = GNOME_FACES.find(g => lower.includes(g));
    return gnome ? `<img src="art/${gnome}.png" alt="">` : "";
  }
  function seatLabel(seat) { return `Seat ${roman[Number(seat)] || Number(seat) + 1}`; }
  function seatColor(seat) { return `var(--seat-${Number(seat) % 3})`; }
  function spokenName(seat) {
    const name = playerName(seat);
    if (/^(seat-?\d+|coworld-smoke\/)/i.test(name)) return `Seat ${["one", "two", "three"][Number(seat)] || Number(seat) + 1}`;
    return name;
  }
  function currentEvent() { return events[index] || {}; }
  function eventPhase(type) {
    return ({game_start: "Opening", turn_start: "New turn", action_made: "Action", action_ruling: "Action ruling", proposal_made: "Proposal", debate_made: "Debate", vote_reveal: "Ballot", judge_ruling: "Ruling", game_over: "Final result", fatal_error: "Error"})[type] || "Moot update";
  }
  function proposalTitle(proposal) {
    if (!proposal) return "Measure pending";
    if (proposal.kind === "amend") return `Amend Rule §${proposal.rule_id}`;
    if (proposal.kind === "repeal") return `Repeal Rule §${proposal.rule_id}`;
    if (proposal.kind === "transmute") return `Unlock Rule §${proposal.rule_id}`;
    return proposal.rule_id ? `Enact Rule §${proposal.rule_id}` : "Enact a new rule";
  }
  function preview(text, length = 150) {
    const clean = String(text || "").replace(/\s+/g, " ").trim();
    return clean.length > length ? `${clean.slice(0, length).trim()}…` : clean;
  }

  function renderScoreboard(state) {
    const threshold = Number(state.world?.common?.victory_points || 100);
    $("#scoreboard").innerHTML = players.slice(0, 3).map((player, position) => {
      const seat = Number(player.seat ?? position);
      const points = Number(state.world?.players?.[seat]?.points || 0);
      const progress = Math.max(0, Math.min(100, threshold ? points / threshold * 100 : 0));
      const isProposer = state.proposer === seat && !state.over;
      const isWinner = state.winners.includes(seat);
      return `<article class="delegate seat-${seat % 3} ${isProposer ? "proposer" : ""} ${isWinner ? "winner" : ""}" data-seat="${seat}">
        <div class="avatar" aria-hidden="true">${gnomeFace(player.policy) || roman[seat] || seat + 1}</div>
        <div class="delegate-copy"><div class="delegate-name">${esc(player.policy || seatLabel(seat))}${player.player ? `<span class="delegate-owner"> (${esc(player.player)})</span>` : ""}</div><div class="delegate-role">${isWinner ? "Winner" : isProposer ? "Has the floor" : seatLabel(seat)}</div></div>
        <div class="score">${esc(points)}<small>points</small></div>
        <div class="meter" title="${points} of ${threshold} victory points"><span style="width:${progress}%"></span></div>
      </article>`;
    }).join("");
  }

  function renderRules(state) {
    const rules = state.rules || [];
    const activeCount = rules.filter(rule => rule.active !== false).length;
    $("#ruleCount").textContent = activeCount;
    $("#rules").innerHTML = rules.length ? rules.map(rule => {
      const history = Array.isArray(rule.history) ? rule.history : [];
      return `<article class="rule ${rule.active === false ? "repealed" : ""} ${rule.mutable === false ? "protected" : ""}">
        <div class="rule-no">§${esc(rule.id)}<span class="rule-version">${rule.active === false ? "repealed" : rule.mutable === false ? `protected · version ${rule.version || 1}` : `mutable · version ${rule.version || 1}`}</span></div>
        <div class="rule-copy">${esc(rule.text)}</div>
        ${history.length ? `<details class="rule-history"><summary>${history.length} earlier ${history.length === 1 ? "version" : "versions"}</summary><ol>${history.map(item => `<li>${esc(item.text)}</li>`).join("")}</ol></details>` : ""}
      </article>`;
    }).join("") : `<div class="empty-state"><h2>Gnome Law is not yet seated.</h2><p>Rules will appear here when the Moot is called to order.</p></div>`;
    if (state.hostConstraints.length) $("#hostLaw").innerHTML = state.hostConstraints.map(constraint => `<div>· ${esc(constraint)}</div>`).join("");
  }

  function measureStrip(state) {
    const proposal = state.proposal?.proposal;
    if (!proposal) return "";
    return `<div class="measure-strip"><strong>${esc(proposalTitle(proposal))}</strong><br>${esc(preview(proposal.text || `Rule §${proposal.rule_id}`, 235))}</div>`;
  }

  function beatHeader(title, subtitle, state) {
    return `<div class="beat-head"><div><h2 class="beat-title">${esc(title)}</h2>${subtitle ? `<p class="beat-subtitle">${esc(subtitle)}</p>` : ""}</div><div class="turn-mark">${state.turn ? `Turn ${state.turn} / ${state.maxTurns}` : "Lobby"}</div></div>`;
  }

  function renderOpening(state) {
    const muse = state.world?.common?.muse || [];
    return `<div class="welcome"><img class="hero-art" src="art/moot_hero.png" alt="The Gnome Moot at the Heartleaf village plaza"><h2>The rules are alive.</h2><p>Three gnome elders of Heartleaf act inside a game while rewriting its Gnome Law. Every move and measure is interpreted in public.</p>${muse.length ? `<div class="changes"><span class="change">Tonight's muse · ${muse.map(esc).join(" + ")}</span></div>` : ""}<div class="flow"><span>Act</span><span>Propose</span><span>Debate</span><span>Vote</span><span>Rule</span></div></div>`;
  }

  function renderTurnStart(state) {
    const order = state.world?.common?.proposer_order || [];
    return `${beatHeader(`${playerName(state.proposer)} has the floor`, `${state.required} AYE votes are ordinarily required to change Gnome Law.`, state)}
      <div class="outcome"><div class="verdict">Awaiting an action</div><p class="judge-summary">${esc(playerName(state.proposer))} may first make one natural-language move under the rules already in force.</p>${order.length ? `<div class="changes"><span class="change">Proposer order · ${order.map(seatLabel).join(" → ")}</span></div>` : ""}</div>`;
  }

  function renderAction(state) {
    const event = state.action || {};
    const action = event.action || {};
    const repaired = Number(event.attempt) === 2;
    return `${beatHeader(repaired ? `${playerName(event.player)} repairs the move` : `${playerName(event.player)} acts`, repaired ? "One corrected action is offered after the Elder's rejection." : "The move is interpreted under rules already active at this turn's start.", state)}
      <article class="measure"><div class="measure-text">${esc(action.text || "pass")}</div><div class="measure-byline">${repaired ? "Repair" : "Action"} by ${esc(playerName(event.player))} · ${esc(seatLabel(event.player))}</div></article>`;
  }

  function renderActionRuling(state) {
    const ruling = state.actionRuling || {};
    const changes = ruling.state_ops || [];
    return `${beatHeader(ruling.valid ? "The move takes effect" : "The move is rejected", ruling.valid ? "The public game state has been updated." : ruling.attempt === 1 ? "The player may repair the move once." : "The action phase ends with no effect.", state)}
      <article class="outcome ${ruling.valid ? "adopted" : "rejected"}"><div class="verdict">${ruling.valid ? "Valid action" : "Invalid action"}</div><p class="judge-summary">${esc(ruling.summary || "No action ruling was recorded.")}</p><div class="judge-byline">The Elder · ${esc(ruling.source || "keeper of Gnome Law")}</div>
      ${changes.length ? `<div class="changes">${changes.map(change => `<span class="change">${esc(describeChange(change))}</span>`).join("")}</div><details><summary>Inspect exact state changes</summary><pre class="technical">${esc(JSON.stringify(changes, null, 2))}</pre></details>` : ""}</article>`;
  }

  function renderProposal(state) {
    const proposal = state.proposal?.proposal || {};
    return `${beatHeader(proposalTitle(proposal), `${playerName(state.proposer)} asks the Moot to change the rules.`, state)}
      <article class="measure"><div class="measure-text">${esc(proposal.text || `Rule §${proposal.rule_id}`)}</div><div class="measure-byline">Introduced by ${esc(playerName(state.proposer))} · ${esc(seatLabel(state.proposer))}</div>
      ${proposal.rationale ? `<details><summary>Why the proposer says this should pass</summary><div class="detail-copy">${esc(proposal.rationale)}</div></details>` : ""}</article>`;
  }

  function renderDebate(state) {
    const argumentsHtml = state.debates.map(statement => {
      const intent = ["aye", "nay"].includes(statement.vote_intent) ? statement.vote_intent : "undecided";
      return `<details class="argument" data-seat="${esc(statement.seat)}" style="--speaker:${seatColor(statement.seat)}"><summary><div class="speaker-line"><span class="speaker-dot"></span><span class="speaker-name">${esc(playerName(statement.seat))}</span><span class="stance ${intent}">${esc(intent)}</span></div><div class="preview">${esc(preview(statement.text))}</div></summary><div class="argument-body">${esc(statement.text)}</div></details>`;
    }).join("");
    return `${beatHeader("The opposition answers", "The two non-proposers argue independently before the secret ballot.", state)}${measureStrip(state)}<div class="arguments">${argumentsHtml || "<div class=\"empty-state\"><p>No debate was recorded.</p></div>"}</div>`;
  }

  function renderVote(state) {
    const ayes = state.votes.filter(vote => vote.vote === "aye").length;
    const ballots = state.votes.map(vote => {
      const value = vote.vote === "aye" ? "aye" : "nay";
      return `<details class="ballot ${value}" data-seat="${esc(vote.seat)}" style="--speaker:${seatColor(vote.seat)}"><summary><div class="ballot-result"><span class="ballot-mark">${esc(value.toUpperCase())}</span><span class="ballot-name">${esc(playerName(vote.seat))}</span></div></summary><div class="ballot-body">${esc(vote.reason || "No reason recorded.")}</div></details>`;
    }).join("");
    return `${beatHeader(state.passed ? "The measure passes the ballot" : "The measure fails the ballot", `${ayes} of ${state.votes.length} gnomes voted AYE; ${state.required} were required.`, state)}${measureStrip(state)}<div class="ballots">${ballots}</div>`;
  }

  function describeChange(change) {
    if (change.op === "amend") return `Amend Rule §${change.rule_id}`;
    if (change.op === "enact") return `Enact Rule §${change.rule_id || "new"}`;
    if (change.op === "repeal") return `Repeal Rule §${change.rule_id}`;
    if (change.op === "transmute") return `Unlock Rule §${change.rule_id}`;
    const owner = change.scope === "player" ? playerName(change.seat) : "Common state";
    if (change.op === "increment") return `${owner} · ${change.key} ${Number(change.value) >= 0 ? "+" : ""}${change.value}`;
    if (change.op === "set") return `${owner} · set ${change.key}`;
    return `${change.op || "change"} · ${change.key || change.scope || "state"}`;
  }

  function renderRuling(state) {
    const ruling = state.ruling || {};
    const changes = [...(ruling.rule_ops || []), ...(ruling.state_ops || [])];
    const adopted = Boolean(ruling.adopted);
    return `${beatHeader(adopted ? "Entered into law" : "Not adopted", adopted ? "Gnome Law and public state have been updated." : "Gnome Law remains unchanged by this measure.", state)}${measureStrip(state)}
      <article class="outcome ${adopted ? "adopted" : "rejected"}"><div class="verdict">${adopted ? "Adopted" : ruling.passed_vote ? "Vetoed" : "Rejected"}</div><p class="judge-summary">${esc(ruling.summary || "No ruling summary was recorded.")}</p><div class="judge-byline">The Elder · ${esc(ruling.source || "keeper of Gnome Law")}</div>
      ${changes.length ? `<div class="changes">${changes.map(change => `<span class="change">${esc(describeChange(change))}</span>`).join("")}</div><details><summary>Inspect exact state changes</summary><pre class="technical">${esc(JSON.stringify(changes, null, 2))}</pre></details>` : ""}</article>`;
  }

  function renderFinale(state) {
    const winners = state.winners.length ? state.winners : [0, 1, 2].filter(seat => state.world?.players?.[seat]?.points === Math.max(...state.world.players.map(player => player.points)));
    const title = winners.length === 1 ? `${playerName(winners[0])} wins` : winners.length ? `${winners.length} gnomes share victory` : "The Moot adjourns";
    return `<div class="finale"><img class="hero-art" src="art/moot_hero.png" alt="The Gnome Moot at the Heartleaf village plaza"><h2>${esc(title)}</h2><p>${esc(state.reason)}</p><div class="winner-list">${winners.map(seat => `<span class="winner-chip">${esc(playerName(seat))} · ${esc(state.world?.players?.[seat]?.points || 0)} points</span>`).join("")}</div>${replay ? `<button class="primary-action" id="restartInline" type="button">Watch from the opening</button>` : ""}</div>`;
  }

  function renderError(state) {
    return `<div class="empty-state"><div class="orb" aria-hidden="true">!</div><h2>The record stopped.</h2><p>${esc(state.reason || "The viewer could not continue.")}</p></div>`;
  }

  function speechText(value) {
    return String(value || "")
      .replace(/§\s*(\d+)/g, "Rule $1")
      .replace(/\bAYE\b/g, "aye")
      .replace(/\bNAY\b/g, "nay")
      .replace(/→/g, "then")
      .replace(/_/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function splitSpeech(value, maxLength = 240) {
    const words = speechText(value).split(" ").filter(Boolean);
    const chunks = [];
    let current = "";
    words.forEach(word => {
      const candidate = current ? `${current} ${word}` : word;
      if (candidate.length > maxLength && current) {
        chunks.push(current);
        current = word;
      } else {
        current = candidate;
      }
    });
    if (current) chunks.push(current);
    return chunks;
  }

  function narrationParts(event, state) {
    if (event.type === "game_start") {
      return [{role: "judge", focus: ".welcome", text: "The Gnome Moot comes to order."}];
    }
    if (event.type === "turn_start") {
      return [];
    }
    if (event.type === "action_made") {
      const action = event.action || {};
      return [{seat: Number(event.player), focus: ".measure", text: `${spokenName(event.player)} acts. ${action.text || "pass"}`}];
    }
    if (event.type === "action_ruling") {
      if (event.valid) return [{role: "judge", focus: ".outcome", text: `The action is valid. ${event.summary || ""}`}];
      return [{role: "judge", focus: ".outcome", text: `The action is rejected. ${event.summary || ""}`}];
    }
    if (event.type === "proposal_made") {
      const proposal = event.proposal || state.proposal?.proposal || {};
      return [{seat: state.proposer, focus: ".measure", text: `${spokenName(state.proposer)} proposes. ${proposal.text || proposalTitle(proposal)}`}];
    }
    if (event.type === "debate_made") {
      return (event.statements || state.debates || []).map(statement => ({
        seat: Number(statement.seat),
        focus: `.argument[data-seat="${Number(statement.seat)}"]`,
        text: `${spokenName(statement.seat)} responds. ${statement.text}`
      }));
    }
    if (event.type === "vote_reveal") {
      const votes = event.votes || state.votes || [];
      const ayes = votes.filter(vote => vote.vote === "aye").length;
      const count = ["No", "One", "Two", "Three"][ayes] || String(ayes);
      return [{role: "judge", text: `${count} aye ${ayes === 1 ? "vote" : "votes"}. The proposal ${state.passed ? "passes" : "fails"}.`}];
    }
    if (event.type === "judge_ruling") {
      const ruling = state.ruling || event;
      if (ruling.adopted) return [{role: "judge", focus: ".outcome", text: "The proposal enters Gnome Law."}];
      if (ruling.passed_vote) return [{role: "judge", focus: ".outcome", text: "The Elder vetoes the proposal."}];
      return [];
    }
    if (event.type === "game_over") {
      const winners = state.winners || [];
      const result = winners.length === 1 ? `${spokenName(winners[0])} wins.` : winners.length ? `${winners.map(spokenName).join(" and ")} share victory.` : "The Moot adjourns.";
      return [{role: "judge", focus: ".finale", text: result}];
    }
    if (event.type === "fatal_error") {
      return [{role: "judge", focus: ".empty-state", text: `The record stopped. ${state.reason || "The viewer could not continue."}`}];
    }
    return [];
  }

  function voiceQuality(voice) {
    const name = voice.name || "";
    if (/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Pipe Organ|Princess|Trinoids|Whisper|Wobble|Zarvox|eSpeak|Festival|Pico|Flite/i.test(name)) return -1000;
    let score = 0;
    if (/Natural|Enhanced|Premium|Neural|Online/i.test(name)) score += 140;
    if (/Google|Microsoft/i.test(name)) score += 80;
    if (/Samantha|Daniel|Karen|Moira|Tessa|Serena|Ava|Alex|Arthur|Martha|Fiona|Rishi|Veena|Victoria|Zoe|Susan|Tom|Aria|Jenny|Guy|Ryan|Sonia|Libby|Natasha|William|Joanna|Matthew|Amy|Brian/i.test(name)) score += 65;
    if (voice.default) score += 30;
    if (voice.localService) score += 5;
    return score;
  }

  function refreshVoices() {
    if (!speechSupported) return;
    const candidates = window.speechSynthesis.getVoices()
      .filter(voice => /^en/i.test(voice.lang || "") && voiceQuality(voice) > -1000)
      .sort((left, right) => voiceQuality(right) - voiceQuality(left));
    const preferred = candidates.filter(voice => voiceQuality(voice) >= 60);
    voices = preferred.length ? preferred : candidates;
    renderTransport();
  }

  function voiceFor(part) {
    if (!voices.length) return null;
    if (part.role === "judge") {
      return voices.find(voice => /Daniel|Arthur|George|Guy|Matthew|Brian|Alex/i.test(voice.name)) || voices[0];
    }
    const seatPreferences = [
      /Samantha|Ava|Aria|Jenny|Joanna|Serena/i,
      /Daniel|Alex|Arthur|Guy|Ryan|Matthew|Brian/i,
      /Karen|Moira|Tessa|Sonia|Libby|Natasha|Amy|Fiona/i
    ];
    const seat = Math.abs(Number(part.seat) || 0) % 3;
    return voices.find(voice => seatPreferences[seat].test(voice.name)) || voices[seat % Math.min(3, voices.length)];
  }

  function selectedVoiceNames() {
    return [...new Set([0, 1, 2].map(seat => voiceFor({seat})?.name).filter(Boolean))];
  }

  function clearSpeaking() {
    document.querySelectorAll(".speaking").forEach(element => element.classList.remove("speaking"));
    if (spokenDetail && !spokenDetailWasOpen) spokenDetail.open = false;
    spokenDetail = null;
    spokenDetailWasOpen = false;
  }

  function showSpeaker(part) {
    clearSpeaking();
    if (Number.isInteger(part.seat)) document.querySelector(`.delegate[data-seat="${part.seat}"]`)?.classList.add("speaking");
    const focus = part.focus ? document.querySelector(part.focus) : null;
    if (!focus) return;
    focus.classList.add("speaking");
    if (focus instanceof HTMLDetailsElement) {
      spokenDetail = focus;
      spokenDetailWasOpen = focus.open;
      focus.open = true;
      requestAnimationFrame(() => focus.scrollIntoView({block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}));
    }
  }

  function cancelSpeech() {
    speechGeneration += 1;
    const finish = activeSpeechFinish;
    activeSpeechFinish = null;
    finish?.();
    if (speechSupported) window.speechSynthesis.cancel();
    clearSpeaking();
  }

  function speakPart(part, generation) {
    return new Promise(resolve => {
      if (!speechSupported || !narrationEnabled || generation !== speechGeneration || !part.text) { resolve(); return; }
      const utterance = new SpeechSynthesisUtterance(speechText(part.text));
      utterance.voice = voiceFor(part);
      utterance.rate = part.role === "judge" ? .96 : .99;
      utterance.pitch = 1;
      utterance.volume = 1;
      let settled = false;
      let watchdog = null;
      const finish = () => {
        if (settled) return;
        settled = true;
        if (watchdog) clearTimeout(watchdog);
        if (activeSpeechFinish === finish) activeSpeechFinish = null;
        resolve();
      };
      activeSpeechFinish = finish;
      utterance.onend = finish;
      utterance.onerror = finish;
      showSpeaker(part);
      const wordCount = utterance.text.split(/\s+/).length;
      watchdog = setTimeout(() => { window.speechSynthesis.cancel(); finish(); }, Math.max(12000, Math.min(60000, wordCount * 900)));
      try { window.speechSynthesis.speak(utterance); } catch (_error) { finish(); }
    });
  }

  async function narrateCurrentEvent() {
    if (!narrationEnabled || !speechSupported) return;
    const generation = speechGeneration;
    const parts = narrationParts(currentEvent(), reduce(index)).flatMap(part => splitSpeech(part.text).map(text => ({...part, text})));
    for (const part of parts) {
      if (!playing || generation !== speechGeneration || !narrationEnabled) break;
      await speakPart(part, generation);
    }
    clearSpeaking();
  }

  function renderStage(state) {
    const event = currentEvent();
    let html;
    if (!events.length) html = `<div class="empty-state"><div class="orb" aria-hidden="true">❧</div><h2>Waiting for the Moot.</h2><p>The record will appear here as soon as the game connects.</p></div>`;
    else if (event.type === "game_start") html = renderOpening(state);
    else if (event.type === "turn_start") html = renderTurnStart(state);
    else if (event.type === "action_made") html = renderAction(state);
    else if (event.type === "action_ruling") html = renderActionRuling(state);
    else if (event.type === "proposal_made") html = renderProposal(state);
    else if (event.type === "debate_made") html = renderDebate(state);
    else if (event.type === "vote_reveal") html = renderVote(state);
    else if (event.type === "judge_ruling") html = renderRuling(state);
    else if (event.type === "game_over") html = renderFinale(state);
    else if (event.type === "fatal_error") html = renderError(state);
    else html = renderOpening(state);
    $("#stageContent").innerHTML = html;
    $("#restartInline")?.addEventListener("click", () => {
      pause();
      const firstProposal = events.findIndex(item => item.type === "proposal_made");
      setIndex(firstProposal >= 0 ? firstProposal : 0);
    });
  }

  function renderPhases(state) {
    const event = currentEvent();
    const indices = new Map();
    events.forEach((item, itemIndex) => {
      if (item.turn === state.turn && phaseTypes.some(([type]) => type === item.type)) indices.set(item.type, itemIndex);
    });
    $("#phaseTrack").innerHTML = phaseTypes.map(([type, label]) => {
      const target = indices.get(type);
      const available = Number.isInteger(target);
      const active = event.type === type;
      const complete = available && target <= index;
      return `<button type="button" class="phase-step ${available ? "available" : ""} ${complete ? "complete" : ""} ${active ? "active" : ""}" data-index="${available ? target : ""}" ${available ? "" : "disabled"}>${label}</button>`;
    }).join("");
    $("#phaseTrack").querySelectorAll("button.available").forEach(button => button.addEventListener("click", () => { pause(); setIndex(Number(button.dataset.index)); }));
  }

  function renderMeta(state) {
    const event = currentEvent();
    const label = eventPhase(event.type);
    $("#turnMeta").textContent = state.over ? "Final result" : state.turn ? `Turn ${state.turn} of ${state.maxTurns}` : "The Moot assembles";
    $("#phaseMeta").textContent = state.over ? state.reason : label;
    $("#eventLabel").textContent = state.turn ? `Turn ${state.turn} · ${label}` : label;
    $("#eventNo").textContent = `${events.length ? index + 1 : 0} / ${events.length}`;
    const mode = $("#mode");
    mode.textContent = connection === "error" ? "OFFLINE" : replay ? "REPLAY" : connection === "connected" ? "LIVE" : "CONNECTING";
    mode.className = `mode-pill ${connection}`;
    $("#announcer").textContent = `${state.turn ? `Turn ${state.turn}. ` : ""}${label}.`;
  }

  const scrubEl = $("#scrub");
  let scrubFill = null;
  let scrubHead = null;
  let scrubBuiltFor = -1;

  function scrubPercent(eventIndex) {
    return events.length > 1 ? eventIndex / (events.length - 1) * 100 : 0;
  }

  // Parley-style scrubber: a click/drag-to-seek track with alternating turn
  // spans, boundary separators, one beat marker per proposal/ballot/ruling
  // (adopted rulings draw taller), and a brass playhead.
  function rebuildScrub() {
    scrubBuiltFor = events.length;
    scrubEl.innerHTML = "";
    const track = document.createElement("div");
    track.className = "scrub-track";
    scrubEl.appendChild(track);
    scrubFill = document.createElement("div");
    scrubFill.className = "scrub-fill";
    scrubEl.appendChild(scrubFill);
    const turnStarts = [];
    const markers = [];
    let proposer = null;
    events.forEach((event, i) => {
      if (event.type === "turn_start") { turnStarts.push(i); proposer = event.proposer; }
      if (event.type === "proposal_made") markers.push([i, `seat-mark-${Number(proposer) % 3}`, proposalTitle(event.proposal)]);
      if (event.type === "vote_reveal") markers.push([i, event.passed ? "aye" : "nay", event.passed ? "The measure passes" : "The measure fails"]);
      if (event.type === "judge_ruling" && event.adopted) markers.push([i, "adopted", "Entered into law"]);
      if (event.type === "game_over") markers.push([i, "final", "Final result"]);
    });
    turnStarts.forEach((startIdx, turnNo) => {
      const endIdx = turnNo + 1 < turnStarts.length ? turnStarts[turnNo + 1] : events.length - 1;
      const span = document.createElement("div");
      span.className = `turn-span${turnNo % 2 ? " alt" : ""}`;
      span.style.left = `${scrubPercent(startIdx)}%`;
      span.style.width = `${Math.max(0, scrubPercent(endIdx) - scrubPercent(startIdx))}%`;
      scrubEl.appendChild(span);
      if (turnNo > 0) {
        const sep = document.createElement("div");
        sep.className = "turn-sep";
        sep.style.left = `${scrubPercent(startIdx)}%`;
        scrubEl.appendChild(sep);
      }
    });
    markers.forEach(([markerIndex, kind, title]) => {
      const marker = document.createElement("div");
      marker.className = `beat-marker ${kind}`;
      marker.title = title;
      marker.style.left = `${scrubPercent(markerIndex)}%`;
      scrubEl.appendChild(marker);
    });
    scrubHead = document.createElement("div");
    scrubHead.className = "scrub-head";
    scrubEl.appendChild(scrubHead);
  }

  function updateScrub() {
    if (scrubBuiltFor !== events.length) rebuildScrub();
    const pct = events.length ? scrubPercent(Math.max(0, index)) : 0;
    scrubFill.style.width = `${pct}%`;
    scrubHead.style.left = `${pct}%`;
    scrubEl.classList.toggle("empty", !events.length);
    scrubEl.setAttribute("aria-valuemax", String(Math.max(0, events.length - 1)));
    scrubEl.setAttribute("aria-valuenow", String(Math.max(0, index)));
    scrubEl.setAttribute("aria-valuetext", events.length ? `Event ${index + 1} of ${events.length}` : "No events");
  }

  function renderTransport() {
    const hasEvents = events.length > 0;
    updateScrub();
    $("#back").disabled = !hasEvents || index <= 0;
    $("#forward").disabled = !hasEvents || index >= events.length - 1;
    $("#play").disabled = !replay || !hasEvents;
    $("#play").textContent = playing ? "Ⅱ" : "▶";
    $("#play").setAttribute("aria-label", playing ? "Pause replay" : "Play replay");
    $("#play").setAttribute("aria-pressed", String(playing));
    const narration = $("#narration");
    narration.disabled = !speechSupported || !replay || !hasEvents;
    narration.setAttribute("aria-pressed", String(narrationEnabled));
    narration.setAttribute("aria-label", narrationEnabled ? "Disable voice narration" : "Enable voice narration");
    const voiceNames = selectedVoiceNames();
    narration.title = speechSupported
      ? `Voice narration ${narrationEnabled ? "on" : "off"}${voiceNames.length ? ` · ${voiceNames.join(", ")}` : ""}`
      : "Voice narration is unavailable in this browser";
  }

  function render() {
    const state = reduce(index);
    renderScoreboard(state);
    renderRules(state);
    renderStage(state);
    renderPhases(state);
    renderMeta(state);
    renderTransport();
  }

  function setIndex(next) {
    if (!events.length) return;
    index = Math.max(0, Math.min(events.length - 1, next));
    render();
    $("#chamberPanel").scrollTop = 0;
    $("#lawPanel").scrollTop = 0;
  }

  function pause(cancelVoice = true) {
    if (timer) clearTimeout(timer);
    timer = null;
    playing = false;
    if (cancelVoice) cancelSpeech();
    renderTransport();
  }

  async function advancePlayback() {
    timer = null;
    if (!playing) return;
    if (index >= events.length - 1) { pause(false); return; }
    setIndex(index + 1);
    if (narrationEnabled) await narrateCurrentEvent();
    if (!playing) return;
    if (index >= events.length - 1) { pause(false); return; }
    timer = setTimeout(() => { void advancePlayback(); }, narrationEnabled ? 700 : 5200);
  }

  function togglePlay() {
    if (!replay || !events.length) return;
    if (playing) { pause(); return; }
    if (index >= events.length - 1) index = -1;
    playing = true;
    renderTransport();
    void advancePlayback();
  }

  function setNarration(enabled) {
    narrationEnabled = speechSupported && Boolean(enabled);
    if (!narrationEnabled) cancelSpeech();
    renderTransport();
    $("#announcer").textContent = narrationEnabled ? "Voice narration enabled. Playback will follow the speakers." : "Voice narration disabled.";
  }

  function setView(view) {
    activeView = view;
    const chamber = view === "chamber";
    $("#chamberTab").setAttribute("aria-selected", String(chamber));
    $("#lawTab").setAttribute("aria-selected", String(!chamber));
    $("#chamberPanel").hidden = !chamber;
    $("#lawPanel").hidden = chamber;
    $("#phaseTrack").hidden = !chamber;
  }

  function load(data) {
    events = Array.isArray(data?.events) ? data.events : [];
    players = Array.isArray(data?.players) && data.players.length ? data.players : players;
    index = events.length - 1;
    replay = true;
    connection = "connected";
    pause();
    render();
  }

  $("#chamberTab").addEventListener("click", () => setView("chamber"));
  $("#lawTab").addEventListener("click", () => setView("law"));
  function seekFromPointer(evt) {
    if (!events.length) return;
    const rect = scrubEl.getBoundingClientRect();
    const fraction = Math.max(0, Math.min((evt.clientX - rect.left) / rect.width, 1));
    pause();
    setIndex(Math.round(fraction * (events.length - 1)));
  }
  let scrubbing = false;
  scrubEl.addEventListener("pointerdown", evt => {
    scrubbing = true;
    seekFromPointer(evt);
    try { scrubEl.setPointerCapture(evt.pointerId); } catch (_error) {}
  });
  scrubEl.addEventListener("pointermove", evt => { if (scrubbing) seekFromPointer(evt); });
  scrubEl.addEventListener("pointerup", () => { scrubbing = false; });
  scrubEl.addEventListener("pointercancel", () => { scrubbing = false; });
  $("#back").addEventListener("click", () => { pause(); setIndex(index - 1); });
  $("#forward").addEventListener("click", () => { pause(); setIndex(index + 1); });
  $("#play").addEventListener("click", togglePlay);
  $("#narration").addEventListener("click", () => setNarration(!narrationEnabled));
  document.addEventListener("keydown", event => {
    if (["INPUT", "TEXTAREA", "SELECT", "SUMMARY", "BUTTON"].includes(document.activeElement?.tagName)) return;
    if (event.key === "ArrowLeft") { event.preventDefault(); pause(); setIndex(index - 1); }
    if (event.key === "ArrowRight") { event.preventDefault(); pause(); setIndex(index + 1); }
    if (event.key === " ") { event.preventDefault(); togglePlay(); }
  });

  const isReplay = location.pathname.endsWith("/client/replay");
  const endpoint = isReplay ? "replay" : "global";
  const wsPath = location.pathname.replace(/\/client\/(replay|global|player).*$/, `/${endpoint}`);
  const protocol = location.protocol === "https:" ? "wss:" : "ws:";
  try {
    const socket = new WebSocket(`${protocol}//${location.host}${wsPath}`);
    socket.onopen = () => { connection = "connected"; render(); };
    socket.onmessage = message => {
      const payload = JSON.parse(message.data);
      if (payload.type === "replay") load(payload.data);
      else if (payload.type !== "hello") {
        events.push(payload);
        index = events.length - 1;
        connection = "connected";
        render();
      } else {
        connection = "connected";
        render();
      }
    };
    socket.onerror = () => { connection = "error"; render(); };
    socket.onclose = () => { if (!events.length) { connection = "error"; render(); } };
  } catch (_error) {
    connection = "error";
  }

  if (speechSupported) {
    refreshVoices();
    window.speechSynthesis.addEventListener?.("voiceschanged", refreshVoices);
  }

  window.__GNOMIC_VIEWER__ = {
    load,
    setIndex,
    setView,
    setNarration,
    narrationParts: itemIndex => narrationParts(events[itemIndex] || {}, reduce(itemIndex)),
    state: () => ({events, index, activeView, playing, narrationEnabled, speechSupported, voiceCount: voices.length, voiceNames: selectedVoiceNames()})
  };
  setView(activeView);
  render();
})();
</script>
</body>
</html>
